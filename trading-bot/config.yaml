# Trading bot configuration.
# Everything here is a starting point for research/paper trading, not a live-money
# recommendation. Tune symbols, risk, and dates to whatever you actually validate.

exchange: binance          # any ccxt-supported exchange with public OHLCV data
timeframe: 1d               # candle size: 1h, 4h, 1d, ...

# Backtest window (ignored by paper trading, which always uses live data)
backtest:
  start: "2020-01-01"
  end: "2025-01-01"
  starting_equity: 10000
  fee_rate: 0.0004          # taker fee, as a fraction (0.0004 = 4 bps)
  slippage_bps: 5            # assumed slippage per fill, in basis points

# Shared risk defaults, applied to every sleeve unless a sleeve sets its own
# `risk_overrides`. This is what actually determines whether months close
# green, far more than any entry signal does.
risk:
  risk_per_trade_pct: 0.75   # % of a sleeve's current equity risked on a trade's stop distance
  max_open_positions: 4
  max_symbol_exposure_pct: 30    # cap notional exposure to one symbol
  daily_loss_kill_switch_pct: 3   # stop opening new trades if today's loss (for that sleeve) exceeds this
  monthly_loss_kill_switch_pct: 8 # stop opening new trades if this month's loss (for that sleeve) exceeds this

# Sleeves: independent capital allocations, each running its own strategy.
# The point of splitting capital this way -- rather than one strategy over
# one pool -- is that trend-following and mean-reversion are built to be
# active in *different* market regimes (see mean_reversion.py's docstring),
# so combining their equity curves smooths the portfolio's month-to-month
# P&L even though neither strategy alone is smooth. capital_allocation_pct
# across all sleeves should sum to <= 100.
sleeves:
  - name: trend
    type: trend_following
    capital_allocation_pct: 60
    symbols:
      - BTC/USDT
      - ETH/USDT
      - SOL/USDT
      - BNB/USDT
    params:
      fast_ema: 20
      slow_ema: 55
      trend_filter_ema: 200
      atr_period: 14
      atr_stop_multiple: 2.5     # initial stop distance = N * ATR
      atr_trail_multiple: 3.0    # trailing stop distance once in profit
      allow_shorts: true

  - name: mean_reversion
    type: mean_reversion
    capital_allocation_pct: 40
    symbols:
      - BTC/USDT
      - ETH/USDT
      - SOL/USDT
      - BNB/USDT
      - ADA/USDT
      - XRP/USDT
      - LTC/USDT
      - DOGE/USDT
    risk_overrides:
      max_open_positions: 6      # more, smaller, shorter-lived positions than trend
    params:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      adx_period: 14
      adx_max: 20                 # only trade when ADX is below this (non-trending regime)
      atr_period: 14
      atr_stop_multiple: 2.0      # tighter than trend's -- reversion bets should fail fast
      # Note: the primary exit for this sleeve is take-profit at the (moving)
      # Bollinger mid-band -- i.e. price returning to the mean, which is what
      # actually gives mean-reversion its edge. atr_trail_multiple only
      # matters as a secondary trailing stop if price runs favorably past
      # that without quite reaching the target.
      atr_trail_multiple: 2.5

paper:
  poll_seconds: 60
  state_file: "state/paper_account.json"
  trade_log: "state/paper_trades.csv"
